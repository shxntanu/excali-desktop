[package]
name = "excali-desktop"
version = "0.1.0"
description = "An offline desktop home for Excalidraw"
edition = "2021"

[lib]
name = "excali_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fontdb = "0.24"
ttf-parser = "0.25"
trash = "5.2.9"
tiny_http = "0.12.0"
uuid = { version = "1.28.0", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
