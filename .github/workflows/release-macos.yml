name: Publish macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the app version (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.architecture }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: Apple-Silicon
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            architecture: Intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MCP_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check release version
        run: |
          bun run - <<'JS'
          const { version } = await Bun.file("src-tauri/tauri.conf.json").json();
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error(`Release tag must be v${version}`);
          JS
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build app and DMG
        run: bun run tauri build --target "$MCP_TARGET" --bundles app,dmg
      - name: Verify bundled MCP server
        run: bun scripts/check-mcp.ts "src-tauri/target/$MCP_TARGET/release/bundle/macos/Excali Desktop.app/Contents/MacOS/excali-mcp"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.architecture }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: release
          merge-multiple: true
      - name: Publish DMGs
        run: |
          cat > release-notes.md <<EOF
          Download the DMG for your Mac: aarch64 for Apple Silicon (M-series), or x64 for Intel.

          Open the DMG, drag Excali Desktop into Applications, and eject the disk image.

          These builds are not Developer ID signed or notarized. After attempting to open the app, use System Settings → Privacy & Security → Open Anyway if macOS blocks it.

          Detailed installation and troubleshooting instructions: https://github.com/$GH_REPO/blob/$RELEASE_TAG/README.md#install
          EOF
          gh release create "$RELEASE_TAG" release/*.dmg \
            --target "$RELEASE_COMMIT" \
            --title "Excali Desktop $RELEASE_TAG" \
            --notes-file release-notes.md
